global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'client-nodes'
    static_configs:
      - targets: ['client1-exporter:9100']
        labels:
          group: 'clients'
          host: 'client1'
          instance: 'client1:22'
      - targets: ['client2-exporter:9100']
        labels:
          group: 'clients'
          host: 'client2'
          instance: 'client2:22'
      - targets: ['client3-exporter:9100']
        labels:
          group: 'clients'
          host: 'client3'
          instance: 'client3:22'
