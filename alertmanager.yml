global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:25'
  smtp_from: 'alertmanager@localhost'

route:
  group_by: ['alertname', 'instance']
  group_wait: 1s
  group_interval: 1s
  repeat_interval: 1h
  receiver: 'webhook'
  routes:
    - match:
        severity: critical
      receiver: 'webhook'
      continue: true
    - match:
        severity: warning
      receiver: 'webhook'

receivers:
  - name: 'webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:3001/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
