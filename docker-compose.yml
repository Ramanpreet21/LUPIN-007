version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: tf-prometheus
    hostname: prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - target-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: tf-alertmanager
    hostname: alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - target-net

  server:
    image: alpine:latest
    container_name: tf-server
    hostname: server
    command: >
      /bin/sh -c "apk add --no-cache openssh-server wget curl vim nano sudo bash bc rsyslog iproute2 nginx redis mysql-client bind-tools nmap netcat-openbsd tcpdump strace lsof htop tmux git && echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config && echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config && echo 'root:toor' | chpasswd && ssh-keygen -A && mkdir -p /run/sshd && /usr/sbin/sshd && tail -f /dev/null"
    ports:
      - "127.0.0.1:2222:22"
    networks:
      - target-net
    volumes:
      - ./test-apps:/test-apps:ro

  client1:
    image: alpine:latest
    container_name: tf-client1
    hostname: client1
    command: >
      /bin/sh -c "apk add --no-cache openssh-server bind nginx redis mysql bash curl wget htop iproute2 bc && echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config && echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config && echo 'root:password123' | chpasswd && echo 'client1 ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers && chmod 777 /tmp && ssh-keygen -A && mkdir -p /run/sshd && /usr/sbin/sshd && nohup sh -c 'while true; do :; done' & nohup sh -c 'while true; do :; done' & nohup sh -c 'while true; do :; done' & dd if=/dev/zero of=/tmp/bigfile bs=1M count=400 2>/dev/null & tail -f /dev/null"
    ports:
      - "127.0.0.1:2223:22"
    networks:
      - target-net

  client1-exporter:
    image: prom/node-exporter:latest
    container_name: tf-client1-exporter
    pid: "service:client1"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.diskstats
      - --collector.netdev
    ports:
      - "127.0.0.1:9101:9100"
    networks:
      - target-net
    restart: unless-stopped

  client2:
    image: alpine:latest
    container_name: tf-client2
    hostname: client2
    command: >
      /bin/sh -c "apk add --no-cache openssh-server apache2 php php-cgi mysql php-mysqli php-apache2 php-fpm curl wget samba nfs-utils htop iproute2 bc nginx && echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config && echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config && echo 'root:admin' | chpasswd && echo 'client2 ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers && chmod 777 /tmp && chmod 777 /var/www/localhost/htdocs 2>/dev/null || true && ssh-keygen -A && mkdir -p /run/sshd && /usr/sbin/sshd && nginx && tail -f /dev/null"
    ports:
      - "127.0.0.1:2224:22"
    networks:
      - target-net

  client2-exporter:
    image: prom/node-exporter:latest
    container_name: tf-client2-exporter
    pid: "service:client2"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.diskstats
      - --collector.netdev
    ports:
      - "127.0.0.1:9102:9100"
    networks:
      - target-net
    restart: unless-stopped

  client3:
    image: alpine:latest
    container_name: tf-client3
    hostname: client3
    command: >
      /bin/sh -c "apk add --no-cache openssh-server docker python3 py3-pip nodejs npm ruby ruby-dev go perl bash htop iproute2 bc && echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config && echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config && echo 'root:secret' | chpasswd && echo 'client3 ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers && chmod 777 /tmp && ssh-keygen -A && mkdir -p /run/sshd && /usr/sbin/sshd && pip3 install --break-system-packages flask fastapi requests paramiko && tail -f /dev/null"
    ports:
      - "127.0.0.1:2225:22"
    networks:
      - target-net

  client3-exporter:
    image: prom/node-exporter:latest
    container_name: tf-client3-exporter
    pid: "service:client3"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.diskstats
      - --collector.netdev
    ports:
      - "127.0.0.1:9103:9100"
    networks:
      - target-net
    restart: unless-stopped

  attacker:
    image: alpine:latest
    container_name: tf-attacker
    hostname: attacker
    command: >
      /bin/sh -c "apk add --no-cache nmap nikto hydra john netcat-openbsd curl wget tcpdump strace python3 py3-pip git bash htop iproute2 && pip3 install requests paramiko pwntools scapy 2>/dev/null; echo 'root:hacker' | chpasswd; chmod 777 /tmp; tail -f /dev/null"
    ports:
      - "127.0.0.1:2226:22"
    networks:
      - target-net

networks:
  target-net:
    driver: bridge
